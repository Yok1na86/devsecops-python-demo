name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write  # Разрешение на загрузку отчетов в папку Security

jobs:
  # 1. Поиск секретов
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Статический анализ Python-кода (SAST + SARIF)
  # 2. Статический анализ Python-кода (SAST + SARIF)
  sast-python:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit & Sarif plugin
        run: |
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit with SARIF export
        run: |
          bandit -r . -f sarif -o bandit-results.sarif || true

      - name: Upload Bandit SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Выполнить даже если на предыдущих шагах были ошибки
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # 3. Проверка зависимостей
  sca-dependencies:
    name: SCA (Pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Dependencies
        run: |
          pip install pip-audit
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi

  # 4. Проверка Docker и сканирование образа (Trivy + SARIF)
  container-security:
    name: Docker Lint & Trivy Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-python, sca-dependencies]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker Image
        run: |
          docker build -t my-python-app:${{ github.sha }} .

      - name: Run Trivy Scanner with SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-python-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy